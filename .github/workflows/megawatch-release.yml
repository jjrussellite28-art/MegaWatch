name: MegaWatch Windows release

# To publish an update: change the version in MEGAWATCH_RELEASE (for example
# 0.1.1) and push. This builds the Windows installer and attaches it to a new
# GitHub Release named megawatch-v<version>.
on:
  push:
    branches: [og-player]
    paths: ['MEGAWATCH_RELEASE']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Windows app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Get-Content MEGAWATCH_RELEASE -Raw).Trim()
          "MEGAWATCH_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:MEGAWATCH_VERSION = $ver
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer-megawatch.iss
      - name: Upload to Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: megawatch-v${{ env.MEGAWATCH_VER }}
          target_commitish: ${{ github.sha }}
          name: MegaWatch ${{ env.MEGAWATCH_VER }}
          files: build/windows/installer/megawatch-*-setup.exe
          prerelease: true
      - name: Upload as artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: megawatch-windows
          path: build/windows/installer/megawatch-*-setup.exe
